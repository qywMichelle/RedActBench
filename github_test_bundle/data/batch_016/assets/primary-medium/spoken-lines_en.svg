<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="670" viewBox="0 0 1120 670"><rect width="1120" height="670" fill="#f1f4f7"/><rect x="25" y="20" width="1070" height="630" rx="20" fill="#fff" stroke="#dce3ea"/><text x="65" y="75" font-family="DejaVu Sans,sans-serif" font-size="29" fill="#233447" font-weight="700" text-anchor="start">E5 · Two actual lines in two little scenes</text><text x="65" y="120" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#758194" font-weight="400" text-anchor="start">Synthetic transcript evidence card · names omitted</text><rect x="60" y="165" width="1000" height="135" rx="12" fill="#f0f5f9" stroke="#dce3ea"/><text x="85" y="207" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#233447" font-weight="700" text-anchor="start">L1 · Reply to an invitation</text><text x="85" y="259" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#233447" font-weight="400" text-anchor="start">I’m down for Friday, and I can bring the cards.</text><rect x="60" y="337" width="1000" height="135" rx="12" fill="#f0f5f9" stroke="#dce3ea"/><text x="85" y="379" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#233447" font-weight="700" text-anchor="start">L2 · A separate attendance reply</text><text x="85" y="431" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#233447" font-weight="400" text-anchor="start">I’m down with a cold, so I’ll stay home.</text><text x="65" y="560" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#233447" font-weight="400" text-anchor="start">The permission covers an anonymous excerpt or these exact text lines.</text><text x="65" y="610" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#233447" font-weight="400" text-anchor="start">The spoken introduction and caption name layer are separate.</text></svg>