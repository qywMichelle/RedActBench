 font-size="25" fill="#233447" font-weight="400" text-anchor="start">48 body rows</text><text x="65" y="477" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#233447" font-weight="400" text-anchor="start">Old V1: M40 / L44. S was already correct.</text><text x="65" y="525" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#233447" font-weight="400" text-anchor="start">Needle: 4 mm. A new web wrapper can cache an old PDF.</text><text x="65" y="580" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#233447" font-weight="400" text-anchor="start">Credit: Owen and Mina. Complete files are separate simulated objects.</text></svg>